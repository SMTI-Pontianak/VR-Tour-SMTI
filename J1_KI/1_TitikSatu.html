<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Tour°</title>
    <meta name="description" content="Jelajahi dunia virtual dengan teknologi 360° VR">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Scripts -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="../js/gif-shader.js"></script>
    <script src="../js/button-component.js"></script>
    <script src="../js/ui-manager.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div style="color: white; letter-spacing: 2px; font-weight: 300;">MEMUAT PENGALAMAN VR...</div>
    </div>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <header>
            <div class="logo-container">
                <div class="logo-icon">S</div>

<!--====================================================== Section 1 ====================================================-->
                <div class="room-info">
                    <h1>Teknik Kimia Industri</h1> <!-- Ganti ... dengan Nama Lokasi Secara Umum -->
                    <p style="font-size: 10px; opacity: 0.6; letter-spacing: 1px;">Pintu Masuk</p> <!-- Ganti ... dengan Nama Lokasi Secara Spesifik -->
                </div>
<!--_____________________________________________________________________________________________________________________-->

            </div>
        </header>

        <div id="info-panel" class="info-panel">
            <h3>Selamat Datang</h3>
            <p>Gunakan kursor di tengah layar untuk berinteraksi dengan objek dan berpindah antar lokasi.</p>
        </div>

<!--====================================================== Section 2 ====================================================-->
        <div class="nav-controls">
            <a class="btn-icon" title="Kembali ke Beranda" href="../index.html" style="text-decoration: none;">
                <i style="font-style: normal;">🏠</i>
            </a>
            <div class="btn-icon" title="Informasi" onclick="toggleInfo(
                    
                    'Tentang Tour', 
                    
                    'Selamat datang di Virtual Tour. Silakan jelajahi lingkungan virtual dengan mengikuti petunjuk arah.'
                    
                    )">
                <i style="font-style: normal;">i</i>
            </div>
<!--_____________________________________________________________________________________________________________________-->

            <div class="btn-icon" title="Bantuan"
                onclick="toggleInfo('Bantuan Navigasi', 'Tahan klik kiri dan gerakkan mouse untuk melihat sekeliling. Arahkan kursor ke panah dan tunggu hingga lingkaran penuh untuk berpindah tempat.')">
                <i style="font-style: normal;">?</i>
            </div>
        </div>

<!--====================================================== Section 7 ====================================================-->
        <!-- Minimap Layout -->
        <div class="minimap-container" id="minimap-container">
            <div class="minimap-close" id="minimap-close" onclick="minimizeMap(event)">×</div>
            <div class="minimap-tutor">Ketuk peta untuk memperbesar</div>
            <div class="minimap-content">
                <!-- Ganti src dengan referensi gambar peta yang sesuai dari folder assets/map -->
                <img src="../assets/map/Peta KI.png" alt="Minimap" onclick="maximizeMap(event)">
            </div>
        </div>
<!--_____________________________________________________________________________________________________________________-->
    </div>

    <!-- A-Frame Scene -->
    <a-scene aframe-watcher loading-screen="enabled: false">

<!--====================================================== Section 3 ====================================================-->
        <!-- Assets -->
        <a-assets>
            <img id="bg" src="../assets/panoramas/TitikSatu_KI.JPG"> <!-- Ganti ... dengan nama file panorama yang ingin digunakan -->
            <!-- Ganti ... dengan nama file gambar yang ingin digunakan -->
            <img id="arrow" src="../assets/ui/arrow.gif">
        </a-assets>
<!--_____________________________________________________________________________________________________________________-->

<!--====================================================== Section 4 ====================================================-->
        <!-- Camera Setup -->
        <a-entity id="camera-rig_ki_1" rotation="0.02692901637114869 63.96386233281484 0.4056541189526229">
<!--_____________________________________________________________________________________________________________________-->

            <a-camera id="camera" look-controls="pointerLockEnabled: false" wasd-controls="enabled: false" fov="170"
                animation__zoom="property: camera.fov; from: 170; to: 80; dur: 3000; easing: easeInOutQuad; delay: 1500">

                <!-- Reticle / Cursor -->
                <a-entity id="cursor" cursor="fuse: true; fuseTimeout: 1500" position="0 0 -1"
                    raycaster="objects: .itemButton, .itemInfo; far: 50"
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
                    material="color: #FFFFFF; shader: flat; opacity: 1"
                    animation__fusing="property: geometry.radiusOuter; from: 0.050; to: 0.010; startEvents: fusing; easing: easeInQuad; dur: 1000"
                    animation__fusing2="property: geometry.radiusInner; from: 0.050; to: 0.005; startEvents: fusing; easing: easeInQuad; dur: 1000">
                </a-entity>
            </a-camera>
        </a-entity>

        <!-- Environment -->
        <a-sky src="#bg" rotation="0 0 0"></a-sky>

<!--====================================================== Section 5 ====================================================-->
        <!-- Tombol Navigasi -->
        <a-entity id="tombol-navigasi1_ki_1" 
                  position="9.7518 -2.79913 16.51835" rotation="-85.34435541591665 143.21653047090058 51.19950857289036" scale="2.04971 2 2">

            <a-entity id="panah-navigasi1_ki_1" class="itemButton" gif-shader="src: ../assets/ui/arrow.gif; transparent: true"
                geometry="primitive: plane" hoverable="opacity: 0.7" clickable="name: Titik_1; 
                target_url: 8_TitikDelapan.html" scale="2 2 2" position="4.55 -0.2 -1.23" rotation="8.777140463609081 -4.832899001928493 160.44278">
            </a-entity>

            <a-text id="text-navigasi1_ki_1" font="kelsonsans" width="6" align="center"
                value="Ikuti Panah \n Untuk Melanjutkan" position="4.08 -1.49 -1.48" rotation="26.06728784727193 -13.788802297618393 -25.93378868100645"
                color="#fff">
            </a-text>
        </a-entity>
<!--_____________________________________________________________________________________________________________________-->


<!--====================================================== Section 6 ====================================================-->
        
        <!-- Tombol Navigasi -->
        <a-entity id="tombol-navigasi2_ki_1"  
                position="-36.69811 -1.84524 2.81058" rotation="-89.99963750135457 89.20666391289353 0" scale="4.29414 2.83356 3.58759"> 

            <a-entity id="panah-navigasi2_ki_1"  class="itemButton" gif-shader="src: ../assets/ui/arrow.gif;  transparent: true" 
                geometry="primitive: plane" hoverable="opacity: 0.7" clickable="name: Titik_1; 
                target_url: 2_TitikDua.html" scale="2 2 2"  position="4.39 -0.52 -1.23" rotation="7.367370000000001 -7.16433 152.29155"> 
            </a-entity> 

            <a-text id="text-navigasi2_ki_1" font="kelsonsans" width="6" align="center" 
                value="Ikuti Panah \n Untuk Melanjutkan" position="3.91715 -1.60388 -1.57425" rotation="26.809841149761482 -10.392881445878002 -24.53290687191159" 
                color="#fff"> 
            </a-text> 
        </a-entity> 

        <a-entity id="tombol-navigasi3_ki_1"  
                position="23.94605 -3.64013 -1.66143" rotation="-87.03973753170875 -22.36139682836577 -86.35276113534688" scale="4.29414 2.83356 3.58759"> 

            <a-entity id="panah-navigasi3_ki_1"  class="itemButton" gif-shader="src: ../assets/ui/arrow.gif;  transparent: true" 
                geometry="primitive: plane" hoverable="opacity: 0.7" clickable="name: Titik_1; 
                target_url: ../3d_TitikTiga.html" scale="2 2 2"  position="4.39 -0.36 -1.23" rotation="4.02737 -2.82433 162.35155"> 
            </a-entity> 

            <a-text id="text-navigasi3_ki_1" font="kelsonsans" width="6" align="center" 
                value="Ikuti Panah \n Untuk Melanjutkan" position="4.03672 -1.66145 -1.56789" rotation="22.465102189284448 1.3917144843727696 -13.394607334568384" 
                color="#fff"> 
            </a-text> 
        </a-entity> 

        <a-entity id="tombol-navigasi4_ki_1"  
                position="-5.03642 -3.64013 -11.91984" rotation="-87.03973753170875 112.03674021767631 -86.35276113534688" scale="4.29414 2.83356 3.58759"> 

            <a-entity id="panah-navigasi4_ki_1"  class="itemButton" gif-shader="src: ../assets/ui/arrow.gif;  transparent: true" 
                geometry="primitive: plane" hoverable="opacity: 0.7" clickable="name: Titik_1; 
                target_url: 3d_TitikTiga.html" scale="2 2 2"  position="4.51 -0.36 -1.23" rotation="4.02737 -3.40433 160.25155"> 
            </a-entity> 

            <a-text id="text-navigasi4_ki_1" font="kelsonsans" width="6" align="center" 
                value="Ikuti Panah \n Untuk Melanjutkan" position="4.03672 -1.66145 -1.56789" rotation="21.21 -20.45 -35.56" 
                color="#fff"> 
            </a-text> 
        </a-entity> 
         

        <!--- Paste Snippet Code Text Dibawah ini -->

        <a-entity id="text-deskripsi1_ki_1" rotation="-39.51059659442644 55.457157948507515 29.700413226196485"  
position="-19.29499 4.76526 0.8801" rotation="-90 -270.85 
16" scale="2 2 2"> 
 
            <!-- Dark background plane behind the text --> 
            <a-plane 
                position="4.08 -1.49 -1.49" 
                rotation="21.21 -20.45 -35.56" 
                width="2.8" 
                height="0.5" 
                color="#111111" 
                opacity="0.75"> 
            </a-plane> 
 
            <a-text id="komponen-text_1_ki_1" font="kelsonsans" 
width="6" align="center" 
                value="Teknik Kimia Industri" position="4.08 -1.49 -1.48" 
rotation="21.21 -20.45 -35.56" 
                color="#fff"> 
            </a-text> 
 
        </a-entity>



<!--_____________________________________________________________________________________________________________________-->

    </a-scene>
</body>

</html>
