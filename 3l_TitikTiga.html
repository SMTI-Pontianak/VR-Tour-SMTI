<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Tour°</title>
    <meta name="description" content="Jelajahi dunia virtual dengan teknologi 360° VR">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Scripts -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="js/gif-shader.js"></script>
    <script src="js/button-component.js"></script>
    <script src="js/ui-manager.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div style="color: white; letter-spacing: 2px; font-weight: 300;">MEMUAT PENGALAMAN VR...</div>
    </div>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <header>
            <div class="logo-container">
                <div class="logo-icon">S</div>

<!--====================================================== Section 1 ====================================================-->
                <div class="room-info">
                    <h1>Area Depan Layanan Publik</h1> <!-- Ganti ... dengan Nama Lokasi Secara Umum -->
                    <p style="font-size: 10px; opacity: 0.6; letter-spacing: 1px;">Area Luar Layanan Publik</p> <!-- Ganti ... dengan Nama Lokasi Secara Spesifik -->
                </div>
<!--_____________________________________________________________________________________________________________________-->

            </div>
        </header>

        <div id="info-panel" class="info-panel">
            <h3>Selamat Datang</h3>
            <p>Gunakan kursor di tengah layar untuk berinteraksi dengan objek dan berpindah antar lokasi.</p>
        </div>

<!--====================================================== Section 2 ====================================================-->
        <div class="nav-controls">
            <a class="btn-icon" title="Kembali ke Beranda" href="index.html" style="text-decoration: none;">
                <i style="font-style: normal;">🏠</i>
            </a>
            <div class="btn-icon" title="Informasi" onclick="toggleInfo(
                    
                    'Tentang Tour', 
                    
                    'Anda sedang berada di area di depan Layanan Publik. Area ini seringkali digunakan untuk panggung pembina upacara dan tempat pegawai, guru, dan siswa berlalulalang untuk masuk dan keluar dari Layanan Publik'
                    
                    )">
                <i style="font-style: normal;">i</i>
            </div>
<!--_____________________________________________________________________________________________________________________-->

            <div class="btn-icon" title="Bantuan"
                onclick="toggleInfo('Bantuan Navigasi', 'Tahan klik kiri dan gerakkan mouse untuk melihat sekeliling. Arahkan kursor ke panah dan tunggu hingga lingkaran penuh untuk berpindah tempat.')">
                <i style="font-style: normal;">?</i>
            </div>
        </div>

<!--====================================================== Section 7 ====================================================-->
        <!-- Minimap Layout -->
        <div class="minimap-container" id="minimap-container">
            <div class="minimap-close" id="minimap-close" onclick="minimizeMap(event)">×</div>
            <div class="minimap-tutor">Ketuk peta untuk memperbesar</div>
            <div class="minimap-content">
                <!-- Ganti src dengan referensi gambar peta yang sesuai dari folder assets/map -->
                <img src="./assets/map/LayananPublik.png" alt="Minimap" onclick="maximizeMap(event)">
            </div>
        </div>
<!--_____________________________________________________________________________________________________________________-->
    </div>

    <!-- A-Frame Scene -->
    <a-scene aframe-watcher loading-screen="enabled: false">

<!--====================================================== Section 3 ====================================================-->
        <!-- Assets -->
        <a-assets>
            <img id="bg" src="./assets/panoramas/3l_TitikTiga.JPG">
            <!-- Ganti ... dengan nama file gambar yang ingin digunakan -->
            <img id="arrow" src="./assets/ui/arrow.gif">
            <img id="door_enter" src="./assets/ui/door_enter.png">
        </a-assets>
<!--_____________________________________________________________________________________________________________________-->

<!--====================================================== Section 4 ====================================================-->
        <!-- Camera Setup -->
        <a-entity id="camera-rig_hlmn3l" rotation="0.0011459155902616466 144.9588951258934 0.34606650825901725">
<!--_____________________________________________________________________________________________________________________-->

            <a-camera id="camera" look-controls="pointerLockEnabled: false" wasd-controls="enabled: false" fov="170"
                animation__zoom="property: camera.fov; from: 170; to: 80; dur: 3000; easing: easeInOutQuad; delay: 1500">

                <!-- Reticle / Cursor -->
                <a-entity id="cursor" cursor="fuse: true; fuseTimeout: 1500" position="0 0 -1"
                    raycaster="objects: .itemButton, .itemInfo; far: 50"
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
                    material="color: #FFFFFF; shader: flat; opacity: 1"
                    animation__fusing="property: geometry.radiusOuter; from: 0.050; to: 0.010; startEvents: fusing; easing: easeInQuad; dur: 1000"
                    animation__fusing2="property: geometry.radiusInner; from: 0.050; to: 0.005; startEvents: fusing; easing: easeInQuad; dur: 1000">
                </a-entity>
            </a-camera>
        </a-entity>

        <!-- Environment -->
        <a-sky src="#bg" rotation="0 0 0"></a-sky>

<!--====================================================== Section 5 ====================================================-->
        <!-- Tombol Navigasi -->
        <a-entity id="tombol-navigasi1_HLMN3l" position="-3.23965 -3.73393 20.95167" rotation="-86.96926372290766 -69.56796252698943 -120.58584347882332" scale="2 2 2">

            <a-entity id="panah-navigasi1_HLMN3a" class="itemButton" gif-shader="src: ./assets/ui/arrow.gif; transparent: true"
                geometry="primitive: plane" hoverable="opacity: 0.7" clickable="name: Titik_1; 
                target_url: 3b_TitikTiga.html" scale="2 2 2" position="4.02388 -2.6551 -1.22999" rotation="8.521601286980735 -5.272930588588967 157.51755703736592">
            </a-entity>

            <a-text id="text-navigasi1_HLMN3a" font="kelsonsans" width="6" align="center"
                value="Ikuti Panah \n Untuk Melanjutkan" position="3.52851 -3.7256 -1.52397" rotation="24.97981395211363 -14.109085705096522 -27.307168515935036"
                color="#fff">
            </a-text>
        </a-entity>
<!--_____________________________________________________________________________________________________________________-->


<!--====================================================== Section 6 ====================================================-->
        
        <!--- Paste Snippet Code Tombol Dibawah ini -->

        <!-- Tombol Navigasi -->
        <a-entity id="tombol-navigasi2_HLMN3l" position="3.03255 -2.73648 -17.07486" rotation="-87.51242771269168 101.4989004496302 -116.11619971900775" scale="2 2 2">

            <a-entity id="panah-navigasi1_HLMN3a" class="itemButton" gif-shader="src: ./assets/ui/arrow.gif; transparent: true"
                geometry="primitive: plane" hoverable="opacity: 0.7" clickable="name: Titik_1; 
                target_url: 3_TitikTiga.html" scale="2 2 2" position="4.02388 -2.6551 -1.22999" rotation="8.521601286980735 -5.272930588588967 157.51755703736592">
            </a-entity>

            <a-text id="text-navigasi1_HLMN4" font="kelsonsans" width="6" align="center"
                value="Ikuti Panah \n Untuk Melanjutkan" position="3.52851 -3.7256 -1.52397" rotation="24.97981395211363 -14.109085705096522 -27.307168515935036"
                color="#fff">
            </a-text>
        </a-entity>

        <!-- Tombol Masuk (Door Icon) -->
        <a-entity id="tombol-masuk-3l" position="18.16776 4.1732 3.10494" rotation="-30.160498335686533 -120.95425534109245 30.0613766371289" scale="2 2 2">
            <a-entity id="ikon-masuk-3l" class="itemButton" 
                geometry="primitive: plane" 
                material="src: #door_enter; transparent: true; shader: flat" 
                hoverable="opacity: 0.7" 
                clickable="name: Masuk_LP; target_url: InRoom_3l.html" 
                scale="1.5 1.5 1.5" 
                position="4.08 -1.49 -1.49" 
                rotation="21.21 -20.45 -35.56">
            </a-entity>
            <a-text id="text-masuk-3l" font="kelsonsans" width="6" align="center"
                value="Masuk Ke Layanan Publik" 
                position="4.45776 -0.81974 -0.68884" 
                rotation="21.21 -20.45 -35.56"
                color="#fff">
            </a-text>
        </a-entity>


        <!--- Paste Snippet Code Text Dibawah ini -->

        <a-entity id="text-deskripsi2_HLMN3l" position="16.06503 9.90016 1.8192" rotation="-26.122864753399625 -119.53045522019234 30.653814997294173" scale="2 2 2">

            <!-- Dark background plane behind the text -->
            <a-plane
                position="4.08 -1.49 -1.49"
                rotation="21.21 -20.45 -35.56"
                width="2.8"
                height="0.5"
                color="#111111"
                opacity="0.75"
                id="plane-deskripsi_HLMN3l" scale="1.06388 1 1">
            </a-plane>

            <a-text id="komponen-text1_HLMN3l" font="kelsonsans" width="6" align="center"
                value="Layanan Publik" position="4.08 -1.49 -1.48" rotation="21.21 -20.45 -35.56"
                color="#fff">
            </a-text>
        </a-entity>

    </a-scene>
</body>

</html>
